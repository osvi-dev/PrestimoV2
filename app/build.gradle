plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id ("org.openjfx.javafxplugin") version "0.1.0"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    // DBJC driver
    implementation 'org.postgresql:postgresql:42.7.5'

}
javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainModule = 'prestimo'
    mainClass = 'core.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}


// Creacion de comandos
// Crear modelo
task modelo {
    doLast {
        // Verificar que se haya proporcionado un nombre
        if (!project.hasProperty("nombre")) {
            throw new GradleException("Debes proporcionar un nombre para el modelo. Ejemplo: ./gradlew view -Pname=NombreDelModelor")
        }
        
        // Obtener el nombre 
        def controllerName = project.property("nombre")
        // Verificamos que no este vacio
        if (controllerName == null || controllerName.trim().isEmpty()) {
            throw new GradleException("El nombre del modelo no puede estar vacío.")
        }
        def controllerClassName = "${controllerName}Model"

        // Verificamos que exista la carpeta, si no, la creamos
        def controllerDir = new File("${project.projectDir}/src/main/java/models/${controllerName}")
        if (!controllerDir.exists()) {
            controllerDir.mkdirs()
        }

        // Ruta completa del archivo 
        def controllerPath = "${controllerDir.absolutePath}/${controllerClassName}.java"

        // Verificar que el controlador no exista
        if (new File(controllerPath).exists()) {
            throw new GradleException("Ya existe un modelo con el nombre proporcionado.")
        } else {
            // Crear el archivo 
            new File(controllerPath).text = """package models;

public class ${controllerClassName} {

    public ${controllerClassName}() {
        
    }
}
"""
            println "Modelo '${controllerClassName}' creado exitosamente en la ruta: ${controllerPath}"
        }
    }
}


